name: Dependency submission

on:
  push:
    paths:
      - '**/package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/dependency-submission.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-submission-${{ github.ref }}
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Scan both pnpm lockfile documents
        env:
          SCAN_REPORT: ${{ runner.temp }}/pnpm-components.json
        shell: bash
        run: |
          set -euo pipefail
          scanner="$RUNNER_TEMP/component-detection"
          curl --fail --location --silent --show-error \
            https://github.com/microsoft/component-detection/releases/download/v9.1.0/component-detection-linux-x64 \
            --output "$scanner"
          echo "421b86daa03ee0d41a4e19e29689f7ba86d56656dcc236f620e462e823fcb2db  $scanner" | sha256sum --check
          chmod +x "$scanner"
          "$scanner" scan --SourceDirectory "$GITHUB_WORKSPACE" \
            --ManifestFile "$SCAN_REPORT" --DetectorsFilter Pnpm \
            2>&1 | tee "$RUNNER_TEMP/pnpm-scan.log"
          # The CLI can exit zero after a parsing error and leave a partial graph.
          if grep -q ' ERR]' "$RUNNER_TEMP/pnpm-scan.log"; then
            echo 'Dependency scanner reported an error; refusing a partial snapshot.' >&2
            exit 1
          fi
      - name: Submit dependency snapshot
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          SCAN_REPORT: ${{ runner.temp }}/pnpm-components.json
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const report = JSON.parse(fs.readFileSync(process.env.SCAN_REPORT, 'utf8'));
            const packages = new Map();
            // Encode each purl component, including Git URL versions, before submission.
            const encode = value => encodeURIComponent(value).replace(/[!'()*]/g, character =>
              '%' + character.charCodeAt(0).toString(16).toUpperCase());
            for (const { component } of report.componentsFound) {
              const url = component.packageUrl;
              if (url?.Scheme !== 'pkg' || url.Type !== 'npm' || !url.Name || !url.Version) {
                throw new Error('Scanner returned a package without a complete npm identity');
              }
              const fullName = url.Namespace ? `${url.Namespace}/${url.Name}` : url.Name;
              const segments = fullName.split('/');
              const namespace = segments.length > 1 ? segments.slice(0, -1).map(encode).join('/') + '/' : '';
              const purl = `pkg:npm/${namespace}${encode(segments.at(-1))}@${encode(url.Version)}`;
              packages.set(component.id, purl);
            }
            const manifests = {};
            let applicationPackages = 0;
            for (const [filename, graph] of Object.entries(report.dependencyGraphs)) {
              const filenameRelative = path.relative(process.env.GITHUB_WORKSPACE, filename).split(path.sep).join('/');
              if (filenameRelative !== 'pnpm-lock.yaml') throw new Error('Unexpected dependency manifest: ' + filenameRelative);
              const direct = new Set(graph.explicitlyReferencedComponentIds);
              const runtime = new Set(graph.dependencies);
              const development = new Set(graph.developmentDependencies);
              const resolved = {};
              const packageUrl = id => {
                const purl = packages.get(id);
                if (!purl || !Object.hasOwn(graph.graph, id)) throw new Error('Missing dependency identity: ' + id);
                return purl;
              };
              for (const [id, dependencies] of Object.entries(graph.graph)) {
                const purl = packageUrl(id);
                const scope = runtime.has(id) || !development.has(id) ? 'runtime' : 'development';
                const relationship = direct.has(id) ? 'direct' : 'indirect';
                const previous = resolved[purl];
                resolved[purl] = {
                  package_url: purl,
                  relationship: previous?.relationship === 'direct' ? 'direct' : relationship,
                  scope: previous?.scope === 'runtime' ? 'runtime' : scope,
                  dependencies: [...new Set([...(previous?.dependencies || []), ...(dependencies || []).map(packageUrl)])],
                };
              }
              applicationPackages += Object.keys(resolved).filter(purl =>
                !purl.startsWith('pkg:npm/pnpm@') && !purl.startsWith('pkg:npm/%40pnpm/')).length;
              manifests[filenameRelative] = { name: filenameRelative, file: { source_location: filenameRelative }, resolved };
            }
            // Refuse empty or manager-only results instead of clearing application dependencies.
            if (!applicationPackages) throw new Error('No application dependencies detected; refusing to submit');
            const snapshot = {
              version: 0,
              sha: context.sha,
              ref: context.ref,
              job: { correlator: 'pnpm-lockfile', id: String(context.runId), html_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}` },
              detector: { name: 'pnpm-component-detection', version: '9.1.0', url: 'https://github.com/microsoft/component-detection/releases/tag/v9.1.0' },
              scanned: new Date().toISOString(),
              manifests,
            };
            try {
              await github.request('POST /repos/{owner}/{repo}/dependency-graph/snapshots', {
                ...context.repo,
                ...snapshot,
              });
            } catch (error) {
              // Avoid dumping the entire dependency snapshot with Octokit's request error.
              throw new Error(`Dependency submission failed (${error.status || 'unknown'}): ${error.message}`);
            }
            core.info(`Submitted ${applicationPackages} application package identities from both lockfile documents`);
